<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE9E0"/>
      <stop offset=".55" stop-color="#D7D3CA"/>
      <stop offset="1" stop-color="#B9B5AC"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242427"/>
      <stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E23A34" stop-opacity="0"/>
      <stop offset="1" stop-color="#E23A34"/>
    </linearGradient>
    <pattern id="halftone" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#242427" opacity=".18"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#halftone)"/>

  <!-- oversized number -->
  <text x="70" y="560" font-family="Impact, Haettenschweiler, sans-serif" font-size="620" fill="#242427" opacity=".07">09</text>

  <!-- speed streaks -->
  <g stroke-linecap="round">
    <path d="M-20 210h520" stroke="url(#streak)" stroke-width="6"/>
    <path d="M40 256h360" stroke="#242427" stroke-opacity=".22" stroke-width="3"/>
    <path d="M-40 300h600" stroke="#C9A34E" stroke-width="2"/>
    <path d="M60 344h300" stroke="#242427" stroke-opacity=".15" stroke-width="2"/>
    <path d="M-20 388h680" stroke="url(#streak)" stroke-width="2" opacity=".6"/>
  </g>

  <!-- track curve -->
  <path d="M-80 800C240 660 430 440 540 300s270-190 760-160" stroke="#242427" stroke-width="120"/>
  <path d="M-80 800C240 660 430 440 540 300s270-190 760-160" stroke="#C9A34E" stroke-width="4" stroke-dasharray="22 16"/>
  <path d="M-80 800C240 660 430 440 540 300s270-190 760-160" stroke="#EDE9E0" stroke-opacity=".22" stroke-width="2"/>

  <!-- car -->
  <g transform="translate(520 330) rotate(-38)">
    <path d="M-90 26h180l-18 44H-64l-26-44Z" fill="#C8102E"/>
    <path d="M-58 26 8-8l74 34H-58Z" fill="#E23A34"/>
    <path d="M-30 22 12 0l44 22H-30Z" fill="#242427" opacity=".85"/>
    <circle cx="-46" cy="74" r="20" fill="#141416"/>
    <circle cx="48" cy="74" r="20" fill="#141416"/>
    <circle cx="-46" cy="74" r="8" fill="#C9A34E"/>
    <circle cx="48" cy="74" r="8" fill="#C9A34E"/>
    <path d="M-90 40h-40l-16 14 30 8 26-2V40Z" fill="#242427"/>
    <path d="M84 36h34l14 12-26 8-22-2V36Z" fill="#242427"/>
  </g>
  <g stroke="#E23A34" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M370 480 240 560M360 440 210 500M356 400 230 430"/>
  </g>

  <!-- checkered strip -->
  <g opacity=".9">
    <rect x="880" y="620" width="320" height="180" fill="#242427"/>
    <g fill="#EDE9E0">
      <path d="M880 620h40v40h-40zM960 620h40v40h-40zM1040 620h40v40h-40zM1120 620h40v40h-40z"/>
      <path d="M920 660h40v40h-40zM1000 660h40v40h-40zM1080 660h40v40h-40zM1160 660h40v40h-40z"/>
      <path d="M880 700h40v40h-40zM960 700h40v40h-40zM1040 700h40v40h-40zM1120 700h40v40h-40z"/>
      <path d="M920 740h40v40h-40zM1000 740h40v40h-40zM1080 740h40v40h-40zM1160 740h40v40h-40z"/>
    </g>
  </g>

  <rect x="18" y="18" width="1164" height="764" stroke="#C9A34E" stroke-width="1.5"/>
  <rect x="30" y="30" width="1140" height="740" stroke="#242427" stroke-opacity=".2"/>

  <g font-family="monospace" fill="#242427">
    <text x="50" y="72" font-size="15" letter-spacing="6" opacity=".8">VELOCITY/9</text>
    <text x="50" y="102" font-size="12" letter-spacing="3" opacity=".45">STREET CIRCUIT / NIGHT</text>
    <text x="1150" y="72" font-size="12" letter-spacing="3" text-anchor="end" opacity=".55">LAP 04 / 12</text>
    <text x="1150" y="766" font-size="12" letter-spacing="3" text-anchor="end" opacity=".55">DRIFT // WIN</text>
  </g>
  <rect x="1146" y="58" width="18" height="18" fill="#C8102E"/>
</svg>
