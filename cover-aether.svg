<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="aetherBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#f0f2f7"/>
      <stop offset="1" stop-color="#dce1eb"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e5252a" stop-opacity=".7"/>
      <stop offset=".4" stop-color="#e5252a" stop-opacity=".25"/>
      <stop offset="1" stop-color="#e5252a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coreGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d878"/>
      <stop offset="1" stop-color="#b68f27"/>
    </linearGradient>
  </defs>

  <!-- Clean Light Background -->
  <rect width="1200" height="800" fill="url(#aetherBg)"/>

  <!-- Golden Isometric Grid Lines -->
  <g stroke="#d4af37" stroke-width="0.8" stroke-opacity="0.3">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
    <!-- Diagonal golden vectors -->
    <line x1="0" y1="0" x2="800" y2="800"/>
    <line x1="400" y1="0" x2="1200" y2="800"/>
    <line x1="0" y1="400" x2="400" y2="800"/>
  </g>

  <!-- Giant Golden Aether Ring -->
  <circle cx="600" cy="400" r="280" stroke="url(#coreGold)" stroke-width="3" stroke-dasharray="14 8"/>
  <circle cx="600" cy="400" r="220" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Floating Grey Monoliths -->
  <polygon points="600,160 670,220 670,330 600,270" fill="#4a5568"/>
  <polygon points="600,160 530,220 530,330 600,270" fill="#2d3748"/>
  <polygon points="600,270 670,330 600,390 530,330" fill="#1a202c"/>

  <!-- Red Core Energy Sphere -->
  <circle cx="600" cy="400" r="160" fill="url(#coreGlow)"/>
  <circle cx="600" cy="400" r="54" fill="#e5252a"/>
  <circle cx="600" cy="400" r="26" fill="#ffffff"/>

  <!-- Kinetic Red Grapple Vectors -->
  <path d="M600 400 L240 220" stroke="#e5252a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="240" cy="220" r="8" fill="#e5252a"/>
  <circle cx="240" cy="220" r="18" stroke="#d4af37" stroke-width="1.5" fill="none"/>

  <path d="M600 400 L960 580" stroke="#e5252a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="960" cy="580" r="8" fill="#e5252a"/>
  <circle cx="960" cy="580" r="18" stroke="#d4af37" stroke-width="1.5" fill="none"/>

  <!-- Tech Specs -->
  <text x="60" y="100" font-family="'JetBrains Mono', monospace" font-size="20" letter-spacing="6" fill="#1a202c" font-weight="bold">AETHER CORE // ROGUELITE</text>
  <text x="60" y="130" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="4" fill="#d4af37">KINETIC GRAPPLE • UNITY HLSL</text>

  <!-- Golden Target Markers -->
  <path d="M60 740 L90 740" stroke="#d4af37" stroke-width="2"/>
  <path d="M60 740 L60 710" stroke="#d4af37" stroke-width="2"/>
  <text x="105" y="744" font-family="'JetBrains Mono', monospace" font-size="11" fill="#718096" letter-spacing="2">SYS_NODE // SECTOR_9</text>
</svg>