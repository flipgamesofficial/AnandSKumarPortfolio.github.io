<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <radialGradient id="space" cx="30%" cy="20%" r="90%">
      <stop offset="0" stop-color="#2a2a30"/>
      <stop offset=".5" stop-color="#17171a"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6E2D8"/>
      <stop offset=".6" stop-color="#8E8B85"/>
      <stop offset="1" stop-color="#3A393D"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E23A34" stop-opacity="0"/>
      <stop offset="1" stop-color="#E23A34"/>
    </linearGradient>
    <linearGradient id="trailGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A34E" stop-opacity="0"/>
      <stop offset="1" stop-color="#C9A34E"/>
    </linearGradient>
    <pattern id="stars" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1.4" fill="#EDE9E0" opacity=".7"/>
      <circle cx="64" cy="42" r="1" fill="#EDE9E0" opacity=".5"/>
      <circle cx="96" cy="90" r="1.6" fill="#EDE9E0" opacity=".65"/>
      <circle cx="34" cy="102" r=".9" fill="#C9A34E" opacity=".8"/>
      <circle cx="108" cy="12" r="1" fill="#EDE9E0" opacity=".4"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#space)"/>
  <rect width="1200" height="800" fill="url(#stars)"/>

  <!-- orbit rings -->
  <g stroke="#C9A34E" stroke-opacity=".45" stroke-width="1.5">
    <ellipse cx="850" cy="430" rx="430" ry="180" transform="rotate(-16 850 430)"/>
    <ellipse cx="850" cy="430" rx="330" ry="132" transform="rotate(-16 850 430)" opacity=".6"/>
    <ellipse cx="850" cy="430" rx="530" ry="225" transform="rotate(-16 850 430)" opacity=".3"/>
  </g>

  <!-- planet -->
  <circle cx="880" cy="400" r="250" fill="url(#planet)"/>
  <g opacity=".25" fill="#1b1b1f">
    <ellipse cx="790" cy="330" rx="95" ry="38" transform="rotate(-18 790 330)"/>
    <ellipse cx="960" cy="470" rx="70" ry="26" transform="rotate(-18 960 470)"/>
    <ellipse cx="840" cy="500" rx="120" ry="40" transform="rotate(-18 840 500)"/>
    <ellipse cx="960" cy="300" rx="45" ry="18" transform="rotate(-18 960 300)"/>
  </g>
  <circle cx="880" cy="400" r="250" stroke="#EDE9E0" stroke-opacity=".25" stroke-width="2"/>
  <path d="M630 400a250 250 0 0 1 500 0" stroke="#E23A34" stroke-opacity=".55" stroke-width="2"/>

  <!-- ship -->
  <g transform="translate(330 300) rotate(-24)">
    <path d="M0 30 150 0l70 30-70 30L0 30Z" fill="#E6E2D8"/>
    <path d="M150 0l40-16 30 46-40 30-30-60Z" fill="#B7B3AA"/>
    <path d="M150 0l40-16 6 20-30 8-16-12Z" fill="#E23A34"/>
    <path d="M20 30l30-10v20l-30-10Z" fill="#1b1b1f"/>
    <circle cx="96" cy="30" r="9" fill="#C9A34E"/>
  </g>
  <path d="M300 340 80 470" stroke="url(#trail)" stroke-width="8" stroke-linecap="round"/>
  <path d="M292 316 40 396" stroke="url(#trailGold)" stroke-width="3" stroke-linecap="round"/>

  <!-- satellite -->
  <g transform="translate(1010 170)" stroke="#C9A34E" stroke-width="2">
    <rect x="-30" y="-12" width="60" height="24" fill="#1b1b1f"/>
    <path d="M-30 0h-30M30 0h30M-60-16v32M60-16v32" fill="none"/>
    <circle cx="0" cy="0" r="5" fill="#E23A34" stroke="none"/>
  </g>

  <rect width="1200" height="800" fill="#0b0b0d" opacity=".08"/>
  <rect x="18" y="18" width="1164" height="764" stroke="#C9A34E" stroke-opacity=".4" stroke-width="1.5"/>

  <g font-family="monospace" fill="#EDE9E0">
    <text x="44" y="66" font-size="15" letter-spacing="6" opacity=".75">ORBITAL DRIFT</text>
    <text x="44" y="96" font-size="12" letter-spacing="3" opacity=".4">SECTOR 12 / RING 04</text>
    <text x="1156" y="66" font-size="12" letter-spacing="3" text-anchor="end" opacity=".5">T-MINUS 00:12</text>
    <text x="1156" y="762" font-size="12" letter-spacing="3" text-anchor="end" opacity=".5">BOOST // DRIFT</text>
  </g>
  <g stroke="#EDE9E0" stroke-opacity=".25">
    <path d="M44 730h120M44 738h70"/>
  </g>
</svg>
