<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="rb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE9E0"/>
      <stop offset=".5" stop-color="#DDD8CD"/>
      <stop offset="1" stop-color="#C2BCB0"/>
    </linearGradient>
    <linearGradient id="rb-red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8102E"/>
      <stop offset="1" stop-color="#E23A34"/>
    </linearGradient>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#242427" stroke-width="0.7" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#rb-bg)"/>
  <rect width="1200" height="800" fill="url(#grid-pattern)"/>

  <!-- Watermark text -->
  <text x="60" y="520" font-family="'Oxanium', sans-serif" font-weight="800" font-size="280" fill="#242427" opacity="0.05">ROADBLOCK</text>

  <!-- NavMesh Surface Polygon Overlay -->
  <polygon points="180,680 440,240 760,240 1020,680" fill="#C9A34E" fill-opacity="0.1" stroke="#C9A34E" stroke-width="2" stroke-dasharray="8 6"/>
  <path d="M310,460 L890,460" stroke="#C9A34E" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M440,240 L760,680" stroke="#C9A34E" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <path d="M760,240 L440,680" stroke="#C9A34E" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Road & Crossings -->
  <rect x="520" y="120" width="160" height="600" fill="#242427" rx="6"/>
  <line x1="600" y1="140" x2="600" y2="700" stroke="#C9A34E" stroke-width="6" stroke-dasharray="28 20"/>

  <!-- Road Block Barricades (Red & White Caution Stripes) -->
  <g transform="translate(420, 380)">
    <!-- Base post -->
    <rect x="0" y="0" width="360" height="48" fill="#1A1A1E" rx="4"/>
    <g clip-path="url(#barrier-clip)">
      <clipPath id="barrier-clip">
        <rect x="4" y="4" width="352" height="40" rx="2"/>
      </clipPath>
      <rect x="4" y="4" width="352" height="40" fill="#FFFFFF"/>
      <path d="M-20,50 L40,-10 L80,-10 L20,50 Z" fill="#C8102E"/>
      <path d="M60,50 L120,-10 L160,-10 L100,50 Z" fill="#C8102E"/>
      <path d="M140,50 L200,-10 L240,-10 L180,50 Z" fill="#C8102E"/>
      <path d="M220,50 L280,-10 L320,-10 L260,50 Z" fill="#C8102E"/>
      <path d="M300,50 L360,-10 L400,-10 L340,50 Z" fill="#C8102E"/>
    </g>
    <!-- Hazard Warning Lights -->
    <circle cx="20" cy="-12" r="12" fill="#E23A34"/>
    <circle cx="20" cy="-12" r="6" fill="#FFF"/>
    <circle cx="340" cy="-12" r="12" fill="#E23A34"/>
    <circle cx="340" cy="-12" r="6" fill="#FFF"/>
  </g>

  <!-- AI Agents / NavMesh Autonomous Nodes -->
  <!-- Agent 1 -->
  <g transform="translate(360, 560)">
    <circle cx="0" cy="0" r="24" fill="#C8102E" fill-opacity="0.9"/>
    <circle cx="0" cy="0" r="10" fill="#FFF"/>
    <!-- Velocity Vector -->
    <line x1="0" y1="0" x2="30" y2="-45" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="30" cy="-45" r="4" fill="#C8102E"/>
    <text x="-40" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#242427" font-weight="600">AGENT_01 [NAVMESH]</text>
  </g>

  <!-- Agent 2 -->
  <g transform="translate(820, 520)">
    <circle cx="0" cy="0" r="22" fill="#C9A34E" fill-opacity="0.95"/>
    <circle cx="0" cy="0" r="9" fill="#FFF"/>
    <line x1="0" y1="0" x2="-35" y2="-40" stroke="#C9A34E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-35" cy="-40" r="4" fill="#C9A34E"/>
    <text x="-40" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#242427" font-weight="600">AGENT_02 [AVOID]</text>
  </g>

  <!-- Agent 3 (Blocked) -->
  <g transform="translate(600, 480)">
    <circle cx="0" cy="0" r="18" fill="#242427"/>
    <circle cx="0" cy="0" r="7" fill="#E23A34"/>
    <text x="25" y="6" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C8102E" font-weight="700">STATUS: RECALCULATING</text>
  </g>

  <!-- CAD Border Overlays -->
  <rect x="24" y="24" width="1152" height="752" stroke="#C9A34E" stroke-width="1.5" fill="none"/>
  <rect x="36" y="36" width="1128" height="728" stroke="#242427" stroke-width="0.8" stroke-opacity="0.2" fill="none"/>

  <g font-family="'JetBrains Mono', monospace" fill="#242427" font-size="13">
    <text x="56" y="70" letter-spacing="4" font-weight="700">ROAD BLOCK // UNITY AI AGENTS</text>
    <text x="56" y="94" letter-spacing="2" opacity="0.6">DYNAMIC NAVMESH PATHFINDING TESTBED</text>
    <text x="1144" y="70" text-anchor="end" letter-spacing="3" fill="#C8102E" font-weight="700">ANANDFRAMEWORKS</text>
    <text x="1144" y="746" text-anchor="end" letter-spacing="2" opacity="0.6">ITCH.IO PLAYABLE TEST</text>
  </g>
</svg>