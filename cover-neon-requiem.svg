<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101012"/>
      <stop offset=".55" stop-color="#1b1b1f"/>
      <stop offset="1" stop-color="#26262b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E23A34"/>
      <stop offset="1" stop-color="#8C1219"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E23A34" stop-opacity=".45"/>
      <stop offset="1" stop-color="#E23A34" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0h4" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <ellipse cx="760" cy="380" rx="420" ry="330" fill="url(#glow)"/>

  <!-- distant towers -->
  <g fill="#141417" opacity=".9">
    <rect x="40" y="330" width="70" height="220"/>
    <rect x="130" y="390" width="46" height="160"/>
    <rect x="980" y="300" width="82" height="250"/>
    <rect x="1080" y="370" width="54" height="180"/>
    <rect x="1145" y="420" width="40" height="130"/>
  </g>

  <!-- sun -->
  <circle cx="760" cy="400" r="230" fill="url(#sun)" opacity=".92"/>
  <g stroke="#101012" stroke-width="14" opacity=".95">
    <path d="M530 330h460M530 366h460M530 402h460M530 438h460M530 474h460"/>
  </g>
  <circle cx="760" cy="400" r="230" stroke="#C9A34E" stroke-opacity=".55" stroke-width="2"/>

  <!-- city -->
  <g fill="#0d0d0f">
    <rect x="0" y="500" width="90" height="220"/>
    <rect x="86" y="540" width="120" height="180"/>
    <rect x="200" y="470" width="66" height="250"/>
    <rect x="262" y="560" width="140" height="160"/>
    <rect x="398" y="430" width="52" height="290"/>
    <rect x="446" y="520" width="110" height="200"/>
    <rect x="552" y="480" width="74" height="240"/>
    <rect x="622" y="555" width="96" height="165"/>
    <rect x="714" y="440" width="58" height="280"/>
    <rect x="768" y="505" width="126" height="215"/>
    <rect x="890" y="465" width="70" height="255"/>
    <rect x="956" y="545" width="120" height="175"/>
    <rect x="1072" y="490" width="58" height="230"/>
    <rect x="1126" y="560" width="74" height="160"/>
  </g>

  <!-- windows -->
  <g fill="#C9A34E" opacity=".5">
    <path d="M24 560h12v10H24zM54 560h12v10H54zM24 600h12v10H24zM24 640h12v10H24zM54 640h12v10H54z"/>
    <path d="M958 590h12v10h-12zM988 590h12v10h-12zM1018 590h12v10h-12zM958 626h12v10h-12zM1018 626h12v10h-12z"/>
    <path d="M1144 600h12v10h-12zM1144 640h12v10h-12z"/>
  </g>
  <g fill="#E23A34" opacity=".75">
    <path d="M216 500h12v10h-12zM216 540h12v10h-12zM412 470h10v10h-10zM412 510h10v10h-10z"/>
    <path d="M728 480h10v10h-10zM728 520h10v10h-10z"/>
  </g>

  <!-- ground grid -->
  <path d="M0 690h1200v110H0z" fill="url(#ground)"/>
  <g stroke="#C9A34E" stroke-opacity=".5" stroke-width="1.5">
    <path d="M0 690h1200"/>
    <path d="M80 690 10 800M200 690 140 800M320 690 270 800M440 690 400 800M560 690 530 800M680 690 660 800M800 690 790 800M920 690 920 800M1040 690 1050 800M1160 690 1180 800"/>
    <path d="M0 734h1200M0 786h1200"/>
  </g>

  <!-- neon signs -->
  <g>
    <rect x="240" y="470" width="4" height="250" fill="#C9A34E" opacity=".8"/>
    <rect x="240" y="470" width="88" height="4" fill="#C9A34E" opacity=".8"/>
    <text x="252" y="506" fill="#EDE9E0" font-family="monospace" font-size="16" letter-spacing="4">NO VACANCY</text>
  </g>
  <g stroke="#E23A34" stroke-width="3" opacity=".9">
    <path d="M900 468v-32h56v32M890 468h76"/>
  </g>

  <rect width="1200" height="800" fill="url(#scan)"/>
  <rect x="18" y="18" width="1164" height="764" stroke="#C9A34E" stroke-opacity=".4" stroke-width="1.5"/>

  <g font-family="monospace" fill="#EDE9E0">
    <text x="44" y="66" font-size="15" letter-spacing="6" opacity=".7">SECTOR 07</text>
    <text x="44" y="96" font-size="12" letter-spacing="3" opacity=".4">NIGHT CYCLE / 03:42</text>
    <text x="1156" y="66" font-size="12" letter-spacing="3" text-anchor="end" opacity=".5">BUILD 1.4.7</text>
    <text x="1156" y="762" font-size="12" letter-spacing="3" text-anchor="end" opacity=".5">RUN // SURVIVE</text>
  </g>
  <circle cx="1136" cy="96" r="5" fill="#E23A34"/>
</svg>
